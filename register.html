<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AWN - Sign Up</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f4;
            margin: 0;
            padding: 20px;
        }

        .register-box {
            max-width: 380px;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px #cccccc;
        }

        h1 {
            text-align: center;
            color: #176b45;
        }

        h2 {
            text-align: center;
            color: #333333;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background-color: #176b45;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #176b45;
        }
    </style>
</head>

<body>

    <div class="register-box">

        <h1>AWN</h1>

        <h2>Create Account</h2>

        <p style="text-align:center;">
            Join us and make a difference!
        </p>

        <form id="registerForm">

            <label for="fullname">Full Name</label>

            <input
                type="text"
                id="fullname"
                name="fullname"
                placeholder="Enter your full name"
                required
            >

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="phone">Phone Number</label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                required
            >

            <label for="city">City</label>

            <select id="city" name="city" required>
                <option value="">Choose your city</option>
                <option value="Khartoum">Khartoum</option>
                <option value="Gezira">Gezira</option>
                <option value="Omdurman">Omdurman</option>
                <option value="Other">Other</option>
            </select>

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                minlength="8"
                required
            >

            <label for="confirmPassword">Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Repeat your password"
                minlength="8"
                required
            >

            <button type="submit">
                Create Account
            </button>

            <p id="message" style="text-align:center;"></p>

        </form>

        <div class="links">

            <p>
                Already have an account?
                <a href="login.html">Login</a>
            </p>

            <a href="index.html">Back to Home</a>

        </div>

    </div>

    <script>
        document.getElementById("registerForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const message =
                document.getElementById("message");

            if (password !== confirmPassword) {

                message.style.color = "red";
                message.textContent =
                    "Passwords do not match!";

                return;
            }

            message.style.color = "#176b45";
            message.textContent =
                "Form checked successfully! Database connection is still needed.";
        });
    </script>

</body>
</html>
